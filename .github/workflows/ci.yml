# Supply-chain hygiene (lesson from the 2026 LiteLLM PyPI compromise): every third-party action
# is pinned to a full commit SHA (bump via Dependabot), dependencies come from uv.lock (--frozen),
# images are scanned and an SBOM is published.
name: ci
on:
  pull_request:
  push: {branches: [main]}
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a  # v5.1.0
        with: {python-version: "3.12", enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest --cov=atlas --cov-report=term-missing
      - run: uvx pip-audit || true   # report-only until the baseline is clean

  image:
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5  # v3.8.0
      - uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355  # v6.10.0
        with:
          context: .
          file: docker/Dockerfile
          tags: atlas:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0  # 0.29.0
        with: {image-ref: "atlas:ci", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1"}
      - uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75  # v0.17.9
        with: {image: "atlas:ci", format: spdx-json, output-file: sbom.spdx.json}
