# USD per 1M tokens. Versioned: bump `version` on every change; costs are computed once at
# request time, so historical llm_calls rows keep the price that applied when they ran.
# Anthropic first-party prices verified 2026-11-03. Others are UNVERIFIED examples: check each
# provider's pricing page before relying on cost reports.
version: "2026-11-03"
models:
  - {provider: anthropic, match: "claude-opus-5-5.*", input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  - {provider: anthropic, match: "claude-sonnet-5-5.*", input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
  - provider: anthropic
    match: "claude-haiku-5-5.*"
    input: 0.10
    output: 0.50
    tiers: [{above_input_tokens: 100000, input: 0.50, output: 2.50}]
  - {provider: anthropic, match: "claude-fable-5-2.*", input: 8.00, output: 40.00, cache_read: 0.20}
  - {provider: openai, match: "gpt-5-mini.*", input: 0.25, output: 2.00, cache_read: 0.025}       # UNVERIFIED
  - {provider: gemini, match: "gemini-2.5-flash.*", input: 0.30, output: 2.50, cache_read: 0.075}  # UNVERIFIED
  - {provider: xai, match: "grok-3-mini.*", input: 0.30, output: 0.50}                              # UNVERIFIED
  - {provider: ollama, match: ".*", input: 0, output: 0}
  - {provider: mock, match: ".*", input: 0, output: 0}
